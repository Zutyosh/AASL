# Unilux catalog: which Proton builds are recommended and which patch
# bundles exist for them. Fetched at run time from the main branch, so a
# new bundle or recommendation does not need an Unilux release. A copy is
# embedded in the binary as the offline fallback.

schema = 1

# What a fresh install uses. It must have a verified bundle below.
recommended_proton = "ge:GE-Proton11-12"

# The recommended recipe on GE-Proton11-12: TLS client-certificate fixes
# (secur32, crypt32, rsaenh from upstream Wine 11.15, commit e99fc2f7).
# GE's own winedmo and kernelbase are left alone. Nothing in it comes
# from the Proton's tree, so later GE-Proton11 releases can use it too.
[[bundle]]
id = "unilux-ge11-12-1"
title = "Unilux bundle for GE-Proton11-12"
archive_format = 2
url = "https://github.com/Zutyosh/Unilux/releases/download/v0.2.1/unilux-ge-GE-Proton11-12-d5049ac1112c11e1.tar.gz"
sha256 = "42ccc9184286d8c45f50c32893ededf4c7ba18118b1862c9d15726a2edb546df"
series = ["tls"]
targets = [
  { proton = "ge:GE-Proton11-12", status = "verified" },
  { proton = "ge:GE-Proton11-*", status = "untested" },
]

# Somnilux's published build: TLS client-certificate fixes (secur32,
# crypt32, rsaenh from Wine 11.15) and media fixes (winedmo, kernelbase
# from GE-Proton11-5's Wine, plus ffmpeg with dav1d).
[[bundle]]
id = "somnilux-build-1"
title = "Somnilux build 1"
archive_format = 2
url = "https://github.com/Vulps22/somnilux/releases/download/somnilux-binaries-build-1/somnilux-binaries.tar.gz"
sha256 = "328bccf4c2864db800e82d02a8732480e2923a0fdfe7f265823cfd066e0645c6"
series = ["tls", "media"]
# Only 11-5: on a newer GE-Proton its winedmo and kernelbase (built
# from 11-5's Wine) would replace GE's own, newer video stack.
targets = [
  { proton = "ge:GE-Proton11-5", status = "verified" },
]
