[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Zutyosh/Unilux"
rust-version = "1.90"

[workspace.dependencies]
unilux-core = { path = "crates/unilux-core" }
unilux-system = { path = "crates/unilux-system" }
unilux-components = { path = "crates/unilux-components" }
unilux-patches = { path = "crates/unilux-patches" }
unilux-install = { path = "crates/unilux-install" }
unilux-runner = { path = "crates/unilux-runner" }
unilux-diag = { path = "crates/unilux-diag" }
unilux-service = { path = "crates/unilux-service" }
unilux-agent = { path = "crates/unilux-agent" }
unilux-update = { path = "crates/unilux-update" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
