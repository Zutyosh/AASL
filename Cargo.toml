[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Zutyosh/AASL"
rust-version = "1.90"

[workspace.dependencies]
aasl-core = { path = "crates/aasl-core" }
aasl-system = { path = "crates/aasl-system" }
aasl-components = { path = "crates/aasl-components" }
aasl-patches = { path = "crates/aasl-patches" }
aasl-install = { path = "crates/aasl-install" }
aasl-runner = { path = "crates/aasl-runner" }
aasl-diag = { path = "crates/aasl-diag" }
aasl-service = { path = "crates/aasl-service" }
aasl-agent = { path = "crates/aasl-agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
