name: Compatibility recipe
description: Share a recipe with the session reports Unilux recorded while you played with it.
title: "Recipe: "
labels: ["recipe"]
body:
  - type: markdown
    attributes:
      value: |
        Unilux fills this form for you: `unilux recipe share <id> --open` (or Share in the app).
        A bot checks the recipe, judges the reports and opens a pull request. The rules are in community/README.md.
  - type: textarea
    id: recipe
    attributes:
      label: Recipe
      description: The recipe TOML, as `unilux recipe share` prints it.
      render: toml
    validations:
      required: true
  - type: textarea
    id: reports
    attributes:
      label: Session reports
      description: The JSON array `unilux recipe share` prints. Anonymous (hardware, durations, counts), nothing that names you.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything the numbers do not say (worlds you tried, what you changed and why).
