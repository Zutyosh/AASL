name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for Freya
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev clang
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bash -n tools/patch-builder/build.sh
      - run: cargo build --release -p aasl-cli
      - uses: actions/upload-artifact@v4
        with:
          name: aasl-cli
          path: target/release/aasl

  # Run the read-only probes on several distributions. The table of
  # supported systems grows from these and from user reports.
  probes:
    needs: check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:stable
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed:latest
          - linuxmintd/mint22-amd64
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aasl-cli
      - name: Probe
        run: |
          chmod +x ./aasl
          ./aasl --json system | tee system.json
          ./aasl --json doctor --offline | tee doctor.json || true
          grep -q '"ok":true' system.json
