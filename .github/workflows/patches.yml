name: Patch bundle

# Builds a Somnium patch bundle for one Proton build and attaches it to a
# GitHub release, so the catalog can point at it. Run it from the Actions
# tab after adding or changing a patch, or when a new Proton is out.
on:
  workflow_dispatch:
    inputs:
      proton:
        description: "Proton build as provider:tag (ge:GE-Proton11-12, cachyos:cachyos-11.0-20261015-slr)"
        required: true
      series:
        description: "Series to build, space separated (empty = all)"
        required: false
        default: ""
      ffmpeg:
        description: "Also rebuild ffmpeg with dav1d"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev clang podman
      - name: Build aasl
        run: cargo build --release -p aasl-cli
      - name: Build the bundle
        env:
          AASL_PATCHES_DIR: ${{ github.workspace }}/patches
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          series=""
          for s in ${{ inputs.series }}; do series="$series --series $s"; done
          ffmpeg=""
          [ "${{ inputs.ffmpeg }}" = "true" ] && ffmpeg="--ffmpeg"
          ./target/release/aasl patch plan "${{ inputs.proton }}" $series $ffmpeg
          ./target/release/aasl patch build "${{ inputs.proton }}" $series $ffmpeg
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="${{ inputs.proton }}"
          tag="patches-${id/:/-}-${{ github.run_number }}"
          out=~/.cache/aasl/patch-builder/out
          gh release create "$tag" --prerelease --title "Patches for $id" \
            --notes "Built from $(git rev-parse --short HEAD). Add it to data/catalog.toml as untested, then verified once someone has played with it." \
            "$out"/*.tar.gz "$out"/*.sha256
