name: Patch bundle

# Builds a recipe's patch bundle for one Proton build and attaches it to a
# GitHub release, so the catalog can point at it. Run it from the Actions
# tab after adding or changing an ingredient, or when a new Proton is out.
on:
  workflow_dispatch:
    inputs:
      proton:
        description: "Proton build as provider:tag (ge:GE-Proton11-12, cachyos:cachyos-11.0-20261015-slr)"
        required: true
      recipe:
        description: "Recipe id from patches/recipes/"
        required: false
        default: "recommended"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev clang podman
      - name: Build unilux
        run: cargo build --release -p unilux-cli
      - name: Build the bundle
        env:
          UNILUX_PATCHES_DIR: ${{ github.workspace }}/patches
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTON: ${{ inputs.proton }}
          RECIPE: ${{ inputs.recipe }}
        run: |
          ./target/release/unilux recipe show "$RECIPE"
          ./target/release/unilux recipe build "$RECIPE" --proton "$PROTON"
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROTON: ${{ inputs.proton }}
          RECIPE: ${{ inputs.recipe }}
        run: |
          id="$PROTON"
          tag="patches-$RECIPE-${id/:/-}-${{ github.run_number }}"
          out=~/.cache/unilux/patch-builder/out
          gh release create "$tag" --prerelease --title "Recipe $RECIPE for $id" \
            --notes "Built from $(git rev-parse --short HEAD). Add it to data/catalog.toml as untested, then verified once someone has played with it." \
            "$out"/*.tar.gz "$out"/*.sha256
