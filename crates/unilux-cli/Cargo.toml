[package]
name = "unilux-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unilux command line: install, launch and troubleshoot Somnium Space on Linux"

[[bin]]
name = "unilux"
path = "src/main.rs"

[dependencies]
unilux-core.workspace = true
unilux-service.workspace = true
unilux-agent.workspace = true
unilux-diag.workspace = true
unilux-components.workspace = true
unilux-patches.workspace = true
unilux-system.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["signal"] }
